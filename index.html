<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J-MAX Shipping</title>
<style>
  :root{--navy:#143b5d;--blue:#1f5f99;--line:#d8e0e8;--bg:#f4f7fa;--ok:#0b6b3e;--warn:#9a5b00;--err:#a61b1b}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1d2b36}
  header{height:62px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 1px 4px #0002}
  header h1{font-size:20px;margin:0} header .ver{font-size:12px;opacity:.85}
  .wrap{max-width:980px;margin:18px auto;padding:0 14px 30px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px #0000000a}
  .top{display:grid;grid-template-columns:1.5fr .5fr .5fr;gap:12px;padding:16px}.metric{border:1px solid var(--line);border-radius:10px;padding:13px;background:#fbfcfd}
  .metric b{display:block;color:#637180;font-size:12px;margin-bottom:5px}.shipment-id{font-size:26px;font-weight:900;color:var(--navy)}.num{font-size:26px;font-weight:900;text-align:right}
  .scan-card{margin-top:14px;padding:16px}.scan-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.scan-head strong{font-size:16px}
  #scanner{position:absolute;left:-10000px;width:1px;height:1px;opacity:0}.status{margin-top:12px;min-height:74px;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;font-weight:850;padding:12px;background:#edf2f7;color:#5b6874;white-space:pre-wrap}
  .status.ok{background:#e7f7ef;color:var(--ok)}.status.duplicate,.status.warning{background:#fff3df;color:var(--warn)}.status.error{background:#fdecec;color:var(--err)}
  .last{margin-top:12px;display:none;grid-template-columns:1fr 1.25fr .5fr;gap:10px}.last>div{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}.last b{display:block;font-size:11px;color:#617080;margin-bottom:4px}.last span{font-weight:850;overflow-wrap:anywhere}
  .actions{display:flex;gap:10px;margin-top:14px}.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer}.btn-primary{background:var(--blue);color:#fff;flex:1;font-size:18px}.btn-secondary{background:#e8eef4;color:#27445d}.btn:disabled{opacity:.45;cursor:not-allowed}
  .list-card{margin-top:14px;overflow:hidden}.list-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.table-wrap{max-height:420px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid #edf1f4;text-align:left}th{position:sticky;top:0;background:#f8fafc;color:#52606d}.td-num{text-align:right;font-weight:800}.empty{padding:28px;text-align:center;color:#7b8793}
  .sync{font-size:12px;color:#697887}.sync.bad{color:var(--err);font-weight:700}
  dialog{border:0;border-radius:12px;padding:0;max-width:620px;width:calc(100% - 30px);box-shadow:0 18px 60px #0005}dialog::backdrop{background:#0006}.dlg{padding:18px}.dlg h2{margin:0 0 12px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;color:#566575;margin-bottom:5px}.field input{width:100%;padding:10px 11px;border:1px solid #b9c6d2;border-radius:8px;font:14px monospace}.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  details.diag{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}details.diag pre{white-space:pre-wrap;word-break:break-all;font-size:11px;background:#f7f9fb;padding:10px;border-radius:8px;max-height:180px;overflow:auto}
  .overlay{display:none;position:fixed;inset:0;background:#0d2740e8;z-index:30;align-items:center;justify-content:center}.overlay-box{background:white;border-radius:16px;padding:30px 36px;text-align:center;min-width:320px}.overlay-box .ov-id{font-size:32px;font-weight:900;color:var(--navy)}.overlay-box p{font-size:18px;margin:10px 0 0}
  @media(max-width:760px){.top{grid-template-columns:1fr 1fr}.top .metric:first-child{grid-column:1/3}.last{grid-template-columns:1fr}.shipment-id{font-size:22px}th:nth-child(1),td:nth-child(1),th:nth-child(2),td:nth-child(2){display:none}}
</style>
</head>
<body>
<header><h1>J-MAX Shipping</h1><div><span class="ver">GitHub Pages v3.0</span>　<button class="btn btn-secondary" style="padding:7px 10px" id="settingsBtn">設定</button></div></header>
<div class="wrap">
  <section class="card top">
    <div class="metric"><b>現在の便</b><div id="shipmentId" class="shipment-id">最初のQRを読み取ってください</div></div>
    <div class="metric"><b>読取件数</b><div id="count" class="num">0</div></div>
    <div class="metric"><b>合計数量</b><div id="totalQty" class="num">0</div></div>
  </section>

  <section class="card scan-card">
    <div class="scan-head"><strong>QR / バーコード待機</strong><span id="syncText" class="sync">未接続</span></div>
    <textarea id="scanner" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="none" aria-label="バーコード入力"></textarea>
    <div id="status" class="status">設定後、QRを読み取ってください</div>
    <div id="last" class="last"><div><b>品番</b><span id="lastPart"></span></div><div><b>品名</b><span id="lastName"></span></div><div><b>数量</b><span id="lastQty"></span></div></div>
    <div class="actions"><button id="completeBtn" class="btn btn-primary" disabled>積 載 完 了</button></div>
    <details class="diag"><summary>診断情報</summary><pre id="diag">—</pre></details>
  </section>

  <section class="card list-card">
    <div class="list-head"><strong>現在便の積載リスト</strong><span id="pendingText" class="sync"></span></div>
    <div class="table-wrap"><table><thead><tr><th>時刻</th><th>種別</th><th>品番</th><th>品名</th><th>数量</th><th>エフNo.</th></tr></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty">まだ読み取りはありません</div></div>
  </section>
</div>

<dialog id="settingsDialog"><div class="dlg"><h2>接続設定</h2><p style="font-size:13px;color:#566575">このPCだけに保存されます。GitHubには保存されません。</p>
  <div class="field"><label>GAS WebアプリURL（/exec）</label><input id="gasUrl" placeholder="https://script.google.com/macros/s/.../exec"></div>
  <div class="field"><label>APIキー</label><input id="apiKey" placeholder="setupSystem() 実行ログに表示されるキー"></div>
  <div class="field"><label>端末名（任意）</label><input id="terminalName" placeholder="例：出荷場PC1"></div>
  <div id="settingMsg" style="font-size:13px"></div><div class="dlg-actions"><button class="btn btn-secondary" id="testBtn">接続テスト</button><button class="btn btn-primary" style="flex:none;font-size:14px" id="saveBtn">保存</button></div></div></dialog>

<div id="overlay" class="overlay"><div class="overlay-box"><div>✓ 積載登録 完了</div><div id="overlayId" class="ov-id"></div><p><span id="overlayCount"></span>件 / 合計 <span id="overlayQty"></span></p></div></div>

<script>
(() => {
  'use strict';
  const APP_VERSION = '3.0';
  const IDLE_MS = 500;
  const LS = {url:'jm_shipping_gas_url', key:'jm_shipping_api_key', terminal:'jm_shipping_terminal', client:'jm_shipping_client_id', queue:'jm_shipping_pending_queue'};
  const $ = id => document.getElementById(id);
  const scanner=$('scanner'), statusEl=$('status'), dialog=$('settingsDialog');
  let idleTimer=null, sending=false, completing=false, currentState=null, scanSerial=0, latestScanSerial=0;
  let retryTimer=null, retryAttempts=0, statusSerial=0;
  let queue = safeJson(localStorage.getItem(LS.queue), []);
  const seenRaw = new Set();

  // v2.8: 旧版でlocalStorageに残った不完全/解析不能な読取は、
  // Google送信待ちとして扱わず自動破棄する。正常解析できる項目だけが送信キュー。
  function isValidQueueItem(item){
    if(!item || !item.raw) return false;
    const raw=normalizeRaw(item.raw);
    if(!raw) return false;
    const p=parseBarcode(raw);
    return p && p.parseStatus==='OK';
  }
  function pruneInvalidQueue(){
    const before=queue.length;
    const kept=[];
    const seenPending=new Set();
    let migrated=0, collapsed=0;
    for(const item of queue){
      if(!isValidQueueItem(item)){
        try{ seenRaw.delete(normalizeRaw(item&&item.raw||'')); }catch(_){}
        continue;
      }
      item.raw=normalizeRaw(item.raw);
      item.parsed=parseBarcode(item.raw);
      if(!item.eventId){
        item.eventId=clientId+'_migrated_'+String(item.createdAt||Date.now())+'_'+Math.random().toString(36).slice(2,8);
        migrated++;
      }
      const key=String(item.shipmentId||'')+'\u0001'+item.raw;
      if(seenPending.has(key)){
        collapsed++;
        continue;
      }
      seenPending.add(key);
      kept.push(item);
    }
    queue=kept;
    if(queue.length!==before || migrated) saveQueue();
    return {purged: before-kept.length-collapsed, collapsed, migrated};
  }

  let buffer='';
  let scanStartedAt=0, lastKeyAt=0, maxKeyGap=0, receivedKeys=0, lastTerminator='', ignoredTerminators=0;

  const clientId = localStorage.getItem(LS.client) || (()=>{const v='c_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);localStorage.setItem(LS.client,v);return v;})();

  window.addEventListener('load', async()=>{
    loadSettingsForm();
    document.body.addEventListener('click', e=>{if(!e.target.closest('button')&&!e.target.closest('input')&&!e.target.closest('dialog')) focusScanner();});
    focusScanner();
    if (!configured()) { dialog.showModal(); setStatus('最初に接続設定をしてください', 'warning'); return; }
    restoreLocalState();
    const qfix=pruneInvalidQueue();
    for(const q of queue){ if(q && q.raw) seenRaw.add(normalizeRaw(q.raw)); }
    for(const it of (currentState?.items||[])){ if(it && it.raw) seenRaw.add(normalizeRaw(it.raw)); }
    if(qfix.purged>0 || qfix.collapsed>0){
      const msgs=[]; if(qfix.purged>0) msgs.push(`読み取り不全 ${qfix.purged}件削除`); if(qfix.collapsed>0) msgs.push(`重複送信待ち ${qfix.collapsed}件整理`);
      setStatus(`旧キャッシュを整理しました：${msgs.join(' / ')}`,'warning');
      setTimeout(()=>{ if(!sending&&!scanStartedAt) setStatus('読み取り待機中',''); },1200);
    } else {
      setStatus('読み取り待機中','');
    }
    if(!queue.length || !currentState?.currentShipmentId) await refreshState();
    else setSync(false,'送信待ちあり');
    pumpQueue();
  });

  // v2.5: Excelに近い受信方式。document keydown横取りをやめ、
  // フォーカス中のtextareaへOS/ブラウザが入力した全文をそのまま保持する。
  function beginScanIfNeeded(now){
    if(scanStartedAt) return;
    clearPreviousFeedbackForNewScan();
    scanStartedAt=now; lastKeyAt=now; maxKeyGap=0; receivedKeys=0; lastTerminator=''; ignoredTerminators=0;
  }

  scanner.addEventListener('keydown', e=>{
    if(dialog.open) return;
    const now=performance.now();
    if(e.key==='Enter' || e.key==='Tab'){
      e.preventDefault();
      beginScanIfNeeded(now);
      const gap=now-lastKeyAt; if(gap>maxKeyGap) maxKeyGap=gap; lastKeyAt=now;
      scanner.value += (e.key==='Enter' ? '\n' : '\t');
      receivedKeys=scanner.value.length; ignoredTerminators++; lastTerminator=e.key;
      scheduleFinalize();
      return;
    }
    if(e.key==='Escape'){ e.preventDefault(); return; }
  });

  scanner.addEventListener('input', ()=>{
    if(dialog.open) return;
    const now=performance.now();
    beginScanIfNeeded(now);
    const gap=now-lastKeyAt; if(lastKeyAt && gap>maxKeyGap) maxKeyGap=gap; lastKeyAt=now;
    receivedKeys=scanner.value.length;
    scheduleFinalize();
  });

  scanner.addEventListener('paste', ()=>{ beginScanIfNeeded(performance.now()); lastTerminator='paste'; });

  function scheduleFinalize(){
    clearTimeout(idleTimer);
    // 141文字で即確定しない。今回確認された長尺QRは141文字を通過してさらに続くため、
    // Excelと同じく「入力が止まった」ことを基準にする。
    idleTimer=setTimeout(()=>attemptFinalizeAfterIdle(),IDLE_MS);
  }

  function attemptFinalizeAfterIdle(){
    clearTimeout(idleTimer); idleTimer=null;
    const raw=normalizeRaw(scanner.value);
    if(!raw) return;
    const parsed=parseBarcode(raw);
    if(parsed.parseStatus==='OK'){
      finalizeScan('idle500');
      return;
    }
    // 500ms時点でまだ有効な伝票になっていなければ、内部区切り後の続きを少し待つ。
    setStatus(`読み取り継続待ち…（現在 ${raw.length}文字）`,'');
    idleTimer=setTimeout(()=>finalizeScan('idle3000'),2500);
  }

  function finalizeScan(reason='unknown'){
    clearTimeout(idleTimer); idleTimer=null;
    const finishedAt=performance.now();
    const rawOriginal=scanner.value;
    let raw=normalizeRaw(rawOriginal);
    const duration=scanStartedAt ? Math.max(0,finishedAt-scanStartedAt) : 0;
    const diagKeys=receivedKeys;
    const diagGap=maxKeyGap;
    const diagTerm=lastTerminator || reason;
    const diagIgnored=ignoredTerminators;
    scanner.value='';
    scanStartedAt=0; lastKeyAt=0; maxKeyGap=0; receivedKeys=0; lastTerminator=''; ignoredTerminators=0;
    if(!raw) return;

    const parsed=parseBarcode(raw);
    const ctrlCount=(rawOriginal.match(/[\x00-\x1F\x7F]/g)||[]).length;
    $('diag').textContent = `受信長(正規化後): ${raw.length}\n入力欄長(生): ${rawOriginal.length}\n制御文字数: ${ctrlCount}\n入力イベント観測長: ${diagKeys}\n読取時間: ${Math.round(duration)} ms\n最大入力間隔: ${diagGap.toFixed(1)} ms\n確定理由: ${diagTerm}\nEnter/Tab保持: ${diagIgnored}回\n種別: ${parsed.type}\n解析状態: ${parsed.parseStatus}\nRAW:\n${visibleRaw(raw)}`;
    if(parsed.parseStatus!=='OK'){
      setStatus(`⚠ 読み取り失敗（${raw.length}文字）\nもう一度QRを読み取ってください`, 'error'); hideParsed(); beep(180,.18); setTimeout(()=>beep(180,.18),220); return;
    }
    if(seenRaw.has(raw)){ setStatus('⚠ すでに読み取り済みです。記録しません。','duplicate'); hideParsed(); beep(260,.15); return; }
    seenRaw.add(raw);
    const seq=++scanSerial; latestScanSerial=seq;
    const shipmentId=ensureLocalShipmentId();
    const eventId=clientId+'_'+Date.now().toString(36)+'_'+seq;
    applyLocalScan(parsed,raw,eventId);
    showParsed(parsed); setStatus(`✓ ${parsed.partNo}　読み取りOK\nGoogleへ保存中…`,'ok'); beep(880,.06);
    queue.push({raw,seq,parsed,shipmentId,eventId,createdAt:Date.now()}); saveQueue(); renderPending(); pumpQueue();
  }

  async function pumpQueue(){
    // 旧版由来の不完全キャッシュは送信対象にしない。
    pruneInvalidQueue();
    if(sending||completing||!configured()||!queue.length){updateCompleteButton();return;}
    if(retryTimer){ clearTimeout(retryTimer); retryTimer=null; }

    sending=true;
    renderPending();
    updateCompleteButton();
    const item=queue[0];
    setSync(false, retryAttempts ? `再送中 ${queue.length}件` : 'Google保存中…');

    try{
      const r=await api('scan',{raw:item.raw,shipmentId:item.shipmentId||currentState?.currentShipmentId||'',eventId:item.eventId||''});
      if(r.status==='ok'||r.status==='warning'||r.status==='duplicate'||r.status==='sent_unconfirmed'){
        queue.shift(); saveQueue();
        retryAttempts=0;
        if(r.status!=='sent_unconfirmed'){ currentState=r; renderState(r); }
        if(r.status==='duplicate') seenRaw.add(item.raw);

        if(item.seq===latestScanSerial){
          if(r.status==='duplicate'){
            setTransientStatus('⚠ すでに読み取り済みです。記録しません。','duplicate',1100);
            hideParsed();
          }else{
            const suffix = r.status==='sent_unconfirmed' ? '送信済み' : (r.replay ? '保存確認OK' : '保存完了');
            setTransientStatus(`✓ ${r.parsed?.partNo||item.parsed.partNo}　${suffix}`,'ok',900);
            showParsed(r.parsed||item.parsed);
          }
        }
      } else if(r.status==='invalid'||r.status==='error'){
        // サーバが明示的に拒否したデータは再送しない。
        queue.shift(); saveQueue(); seenRaw.delete(item.raw);
        retryAttempts=0;
        if(item.seq===latestScanSerial){setTransientStatus(r.message||'保存エラー','error',1400);hideParsed();}
      } else {
        throw new Error(r.message||'不明な応答');
      }

      sending=false;
      renderPending();
      updateCompleteButton();
      if(queue.length){
        setSync(false,`続けて送信中 ${queue.length}件`);
        setTimeout(pumpQueue,0);
      }else{
        setSync(true,'接続中');
        clearCommunicationWarningIfStale();
      }
    }catch(err){
      sending=false;
      retryAttempts++;
      renderPending();
      updateCompleteButton();
      setSync(false,`再送中 ${queue.length}件`);

      // 大きな警告は短時間だけ。以後は右上の「再送中」で状態を示す。
      setTransientStatus(`⚠ Google保存を再試行します（${retryAttempts}回目）`,'warning',1200);
      scheduleRetry();
    }
  }

  function scheduleRetry(){
    if(retryTimer || !queue.length || completing) return;
    retryTimer=setTimeout(()=>{
      retryTimer=null;
      pumpQueue();
    },3000);
  }

  async function refreshState(){
    try{const r=await api('state',{});currentState=r;renderState(r);setSync(true,'接続中');}
    catch(e){setSync(false,'応答確認なし'); if(!currentState?.currentShipmentId) setStatus('読み取り待機中（Google応答確認なし）','warning');}
  }

  async function completeShipment(){
    // 旧版由来の不完全読取キャッシュはここでも必ず掃除する。
    const purged=pruneInvalidQueue();
    if(completing||sending) return;
    if(queue.length){
      setStatus(`Googleへの正常データ送信待ちが ${queue.length}件あります。送信完了後に積載完了できます。`,'warning');
      pumpQueue();
      return;
    }
    if(!currentState?.currentShipmentId){setStatus('まだバーコードが読み取られていません。','warning');return;}

    // 前回の読取エラー/警告を、積載完了操作に持ち越さない。
    clearTimeout(idleTimer); idleTimer=null;
    scanner.value='';
    scanStartedAt=0; lastKeyAt=0; maxKeyGap=0; receivedKeys=0; lastTerminator=''; ignoredTerminators=0;
    hideParsed();
    setStatus('積載完了処理中…','');

    completing=true; updateCompleteButton();
    const localSummary={shipmentId:currentState.currentShipmentId,count:Number(currentState.count||0),totalQuantity:Number(currentState.totalQuantity||0)};
    try{
      const r=await api('complete',{shipmentId:currentState.currentShipmentId});
      const s=(r.status==='completed'&&r.completedShipment)?r.completedShipment:localSummary;
      if(r.status!=='completed'&&r.status!=='sent_unconfirmed') throw new Error(r.message||'完了できませんでした');

      // 完了した瞬間に必ず成功表示へ上書きする。
      // これで直前の「読み取り失敗」「通信エラー」が画面へ残らない。
      setStatus(`✓ 積載完了　${s.shipmentId}`,'ok');
      hideParsed();
      $('diag').textContent='—';
      $('overlayId').textContent=s.shipmentId; $('overlayCount').textContent=s.count; $('overlayQty').textContent=s.totalQuantity; $('overlay').style.display='flex';
      currentState={status:'state',currentShipmentId:'',count:0,totalQuantity:0,items:[]}; renderState(currentState); seenRaw.clear(); saveLocalState();
      setTimeout(()=>{
        $('overlay').style.display='none';
        setStatus('次の便：最初のQRを読み取ってください','');
        hideParsed();
        focusScanner();
      },1600);
      beep(1050,.08); setTimeout(()=>beep(1320,.1),110);
    }catch(e){setStatus('⚠ '+(e.message||e),'error');}
    completing=false; updateCompleteButton();
  }
  $('completeBtn').addEventListener('click',completeShipment);

  async function api(action, params){
    const url=(localStorage.getItem(LS.url)||'').trim();
    const key=(localStorage.getItem(LS.key)||'').trim();
    if(!url||!key) throw new Error('接続設定がありません');
    const payload={action,key,clientId,terminal:localStorage.getItem(LS.terminal)||'',_t:String(Date.now()),...params};
    const q=new URLSearchParams();
    Object.entries(payload).forEach(([k,v])=>q.set(k,String(v??'')));
    const reqUrl=url+(url.includes('?')?'&':'?')+q.toString();

    // まずInspect/Visitorと同じ直接GETでACKを取りに行く。
    try{
      const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),6000);
      try{
        const res=await fetch(reqUrl,{cache:'no-store',credentials:'omit',signal:controller.signal});
        if(!res.ok) throw new Error('GAS HTTP '+res.status);
        const text=await res.text(); let data;
        try{data=JSON.parse(text)}catch(_){throw new Error('GAS応答がJSONではありません')}
        if(data && data.status==='error') throw new Error(data.message||'GASエラー');
        return data;
      } finally { clearTimeout(timer); }
    }catch(firstErr){
      // 書込み系は、応答取得に失敗したらMasterで実績のあるhidden form POSTへフォールバック。
      // 同じeventIdを送るので、最初のGETが実は保存済みでもGAS側で二重登録されない。
      if(action==='scan' || action==='complete'){
        await submitHiddenForm(url,payload);
        return {status:'sent_unconfirmed',message:'Googleへ送信済み'};
      }
      if(firstErr && firstErr.name==='AbortError') throw new Error('GAS応答タイムアウト');
      throw firstErr;
    }
  }

  function submitHiddenForm(url,payload){
    return new Promise((resolve,reject)=>{
      if(navigator.onLine===false){ reject(new Error('ネットワークがオフラインです')); return; }
      const frameName='jm_ship_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
      const frame=document.createElement('iframe');
      frame.name=frameName; frame.style.display='none';
      const form=document.createElement('form');
      form.method='POST'; form.action=url; form.target=frameName; form.style.display='none';
      const ta=document.createElement('textarea'); ta.name='payload'; ta.value=JSON.stringify(payload); form.appendChild(ta);
      let submitted=false, done=false;
      const cleanup=()=>{try{form.remove()}catch{};try{frame.remove()}catch{}};
      const finish=(ok,err)=>{if(done)return;done=true;clearTimeout(timer);cleanup();ok?resolve():reject(err||new Error('GAS送信失敗'));};
      frame.addEventListener('load',()=>{ if(submitted) finish(true); });
      const timer=setTimeout(()=>finish(false,new Error('GAS送信タイムアウト')),7000);
      document.body.appendChild(frame); document.body.appendChild(form);
      submitted=true;
      try{ form.submit(); }catch(e){ finish(false,e); }
    });
  }

  function parseBarcode(raw){
    // 長尺QRを141文字の途中で誤判定しないよう、固定長141は構造まで確認する。
    if(isFixed141(raw)) return parseFixed141(raw);
    const longHonda=parseHondaLong(raw); if(longHonda) return longHonda;
    const h=parseHonda(raw); if(h) return h;
    return {type:'未判定',partNo:'',partName:'',quantity:null,orderNo:'',ticketDate:'',fNo:'',machineCode:'',nextProcess:'',tailCode:'',parseStatus:'要確認'};
  }
  function isFixed141(raw){
    if(raw.length!==141) return false;
    const dateRaw=raw.slice(8,16), part=raw.slice(16,46).trim();
    return /^20\d{6}$/.test(dateRaw) && /^[0-9A-Z-]{8,30}$/i.test(part) && part.includes('-');
  }
  function parseFixed141(raw){
    const orderRaw=raw.slice(0,8).trim(), dateRaw=raw.slice(8,16).trim(), partNo=raw.slice(16,46).trim(), partName=raw.slice(46,76).trim();
    const qtyZone=raw.slice(76,92), qtyMatch=qtyZone.match(/\d+/), nextMatch=qtyZone.match(/[A-Z]\d{2}/), machineCode=raw.slice(112,120).trim(), fNo=raw.slice(125,133).trim(), tailCode=raw.slice(133,141).trim();
    let type='固定長141票'; if(nextMatch&&/^S\d{2}$/.test(nextMatch[0])) type='J-MAX 現品票(溶接)'; else if(/^TR/i.test(machineCode)) type='J-MAX 現品票(プレス品)'; else if(!machineCode) type='外製搬入伝票(支払い用)';
    return {type,partNo,partName,quantity:qtyMatch?Number(qtyMatch[0]):null,orderNo:orderRaw.replace(/^0+/,''),ticketDate:ymd(dateRaw),fNo,machineCode,nextProcess:nextMatch?nextMatch[0]:'',tailCode,parseStatus:(partNo&&partName&&qtyMatch)?'OK':'要確認'};
  }
  function parseHondaLong(raw){
    const text=String(raw);
    const nameRe=/[A-Z][A-Z .\/-]{1,28},[A-Z][A-Z .\/,\-]{1,28}/g;
    let nm, partName='', nameStart=-1, nameEnd=-1;
    while((nm=nameRe.exec(text))){
      const c=nm[0].trim();
      if(!/J-MAX|CO\.?[, ]?LTD|CORPORATION/i.test(c)) { partName=c; nameStart=nm.index; nameEnd=nm.index+nm[0].length; break; }
    }
    if(nameStart<0) return null;
    const candidates=[];
    const pr=/(\d{5})([A-Z]{3})\s*([0-9A-Z]{4})\s+([0-9A-Z]{2})/g;
    let pm;
    while((pm=pr.exec(text))){ if(pm.index<nameStart) candidates.push(pm); }
    if(!candidates.length) return null;
    const best=candidates[candidates.length-1];
    const partNo=[best[1],best[2],best[3],best[4]].join('-').toUpperCase();
    let quantity=null;
    const after=text.slice(nameEnd,nameEnd+80);
    const q=after.match(/^\D*(\d{8})/);
    if(q) quantity=Number(q[1]);
    return {type:'Honda 現品票（長尺）',partNo,partName,quantity,orderNo:'',ticketDate:'',fNo:'',machineCode:'',nextProcess:'',tailCode:'',parseStatus:(partNo&&partName&&quantity!==null)?'OK':'要確認'};
  }
  function parseHonda(raw){
    const text=String(raw);
    // 通常Honda票はハイフン付き品番を優先。数字列の途中を品番と誤認しない。
    const pm=text.match(/(\d{5})\s*-\s*([0-9A-Z]{3})\s*-\s*([0-9A-Z]{4})\s*-\s*([0-9A-Z]{2})/i);
    if(!pm)return null;
    const partNo=[pm[1],pm[2],pm[3],pm[4]].join('-').toUpperCase();
    let partName='',nameEnd=-1; const re=/[A-Z][A-Z .\/-]{1,28},[A-Z][A-Z .\/,\-]{1,28}/g; let m;
    while((m=re.exec(text))){const c=m[0].trim();if(!/J-MAX|CO\.?[, ]?LTD/i.test(c)){partName=c;nameEnd=m.index+m[0].length;break;}}
    let quantity=null;
    if(nameEnd>=0){const after=text.slice(nameEnd,nameEnd+50);const q=after.match(/^\D*(\d{8})/);if(q)quantity=Number(q[1]);}
    if(quantity===null){const q=text.match(/0{5,}(\d{1,3})/);if(q)quantity=Number(q[1]);}
    const eights=text.match(/\d{8}/g)||[]; let fNo='';for(const x of eights){if(!/^0{4,}\d{1,4}$/.test(x)){fNo=x;break;}}
    return {type:'Honda 現品票',partNo,partName,quantity,orderNo:'',ticketDate:'',fNo,machineCode:'',nextProcess:'',tailCode:'',parseStatus:(partName&&quantity!==null)?'OK':'要確認'};
  }
  function normalizeRaw(v){
    let s=String(v??'');
    // リーダー末尾のサフィックス(CR/LF/TAB等)だけは除去する。
    s=s.replace(/[\x00-\x1F\x7F]+$/g,'');
    // QR内部の制御区切りは「削除」すると前後フィールドが連結される。
    // Excel相当の区切りとして1文字=1スペースへ置換して位置/分離を保持する。
    s=s.replace(/[\x00-\x1F\x7F]/g,' ');
    s=s.replace(/\u3000|\u00A0/g,' ');
    s=s.replace(/[！-～]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0));
    return s;
  }
  function ymd(s){return /^\d{8}$/.test(s)?`${s.slice(0,4)}/${s.slice(4,6)}/${s.slice(6,8)}`:s;}
  function visibleRaw(s){return s.replace(/ /g,'·');}

  function todayId(){const d=new Date();return String(d.getFullYear())+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
  function ensureLocalShipmentId(){
    if(!currentState) currentState={status:'state',currentShipmentId:'',count:0,totalQuantity:0,items:[]};
    if(currentState.currentShipmentId) return currentState.currentShipmentId;
    const day=todayId(), dk='jm_shipping_seq_date', nk='jm_shipping_seq_no';
    let n=(localStorage.getItem(dk)===day)?Number(localStorage.getItem(nk)||0):0; n++;
    localStorage.setItem(dk,day); localStorage.setItem(nk,String(n));
    currentState.currentShipmentId=day+'-'+String(n).padStart(3,'0'); currentState.count=0; currentState.totalQuantity=0; currentState.items=[];
    saveLocalState(); renderState(currentState); return currentState.currentShipmentId;
  }
  function applyLocalScan(parsed,raw,eventId){
    if(!currentState) currentState={status:'state',currentShipmentId:'',count:0,totalQuantity:0,items:[]};
    const item={scannedAt:new Date().toLocaleString('ja-JP',{hour12:false}),type:parsed.type,partNo:parsed.partNo,partName:parsed.partName,quantity:parsed.quantity,fNo:parsed.fNo||'',raw:raw||'',eventId:eventId||''};
    currentState.items=[item,...(currentState.items||[])].slice(0,100); currentState.count=Number(currentState.count||0)+1; currentState.totalQuantity=Number(currentState.totalQuantity||0)+(Number(parsed.quantity)||0);
    saveLocalState(); renderState(currentState);
  }
  function saveLocalState(){try{localStorage.setItem('jm_shipping_local_state',JSON.stringify(currentState||{}));}catch{}}
  function restoreLocalState(){try{const x=JSON.parse(localStorage.getItem('jm_shipping_local_state')||'null');if(x&&x.currentShipmentId){currentState=x;renderState(x);}}catch{}}

  function renderState(state){
    if(!state)return; currentState=state; saveLocalState(); const sid=state.currentShipmentId||''; $('shipmentId').textContent=sid||'最初のQRを読み取ってください'; $('count').textContent=state.count||0; $('totalQty').textContent=state.totalQuantity||0; renderItems(state.items||[]); updateCompleteButton();
  }
  function renderItems(items){const tb=$('tbody');tb.innerHTML='';$('empty').style.display=items.length?'none':'block';for(const it of items){const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(timeOnly(it.scannedAt))}</td><td>${esc(it.type)}</td><td><b>${esc(it.partNo)}</b></td><td>${esc(it.partName)}</td><td class="td-num">${esc(it.quantity)}</td><td>${esc(it.fNo)}</td>`;tb.appendChild(tr);}}
  function showParsed(p){$('last').style.display='grid';$('lastPart').textContent=p?.partNo||'—';$('lastName').textContent=p?.partName||'—';$('lastQty').textContent=p?.quantity??'—';}
  function hideParsed(){$('last').style.display='none';}
  function clearPreviousFeedbackForNewScan(){setStatus('読み取り中…','');hideParsed();}
  function setStatus(t,c){
    statusSerial++;
    statusEl.textContent=t;
    statusEl.className='status'+(c?' '+c:'');
    return statusSerial;
  }
  function setTransientStatus(t,c,ms){
    const token=setStatus(t,c);
    setTimeout(()=>{
      if(statusSerial!==token || scanStartedAt || completing) return;
      if(queue.length) setStatus(`読み取り待機中（Google再送中 ${queue.length}件）`,'');
      else setStatus('読み取り待機中','');
    },ms||1000);
  }
  function clearCommunicationWarningIfStale(){
    if(queue.length || scanStartedAt || completing) return;
    const t=String(statusEl.textContent||'');
    if(/Google|送信|再送|通信待ち|保存確認OK/.test(t)) setStatus('読み取り待機中','');
  }
  function setSync(ok,t){$('syncText').textContent=t;$('syncText').className='sync'+(ok?'':' bad');}
  function renderPending(){
    const invalid=queue.filter(x=>!isValidQueueItem(x)).length;
    const valid=Math.max(0,queue.length-invalid);
    $('pendingText').textContent=valid ? (sending?`Google保存中 ${valid}件`:`Google再送中 ${valid}件`) : '';
    saveQueue();
  }
  function updateCompleteButton(){
    // 不完全キャッシュは完了可否の条件にしない。正常な未送信データだけをブロックする。
    const validPending=queue.some(isValidQueueItem);
    $('completeBtn').disabled=!currentState?.currentShipmentId||sending||validPending||completing;
  }
  function saveQueue(){localStorage.setItem(LS.queue,JSON.stringify(queue));}
  function focusScanner(){setTimeout(()=>{try{if(!dialog.open)scanner.focus({preventScroll:true});}catch{}},20);}
  function timeOnly(s){const m=String(s||'').match(/(\d{2}:\d{2}:\d{2})$/);return m?m[1]:s||'';}
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function safeJson(s,d){try{const v=JSON.parse(s);return Array.isArray(v)?v:d}catch{return d}}
  function beep(freq,dur){try{const A=window.AudioContext||window.webkitAudioContext;const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.05,c.currentTime);o.start();o.stop(c.currentTime+dur);o.onended=()=>c.close();}catch{}}

  $('settingsBtn').addEventListener('click',()=>{scanner.blur();loadSettingsForm();dialog.showModal();});
  $('saveBtn').addEventListener('click',async()=>{saveSettingsForm();dialog.close();setStatus('接続確認中…','');await refreshState();pumpQueue();focusScanner();});
  $('testBtn').addEventListener('click',async()=>{saveSettingsForm();$('settingMsg').textContent='接続確認中…';try{const r=await api('ping',{});$('settingMsg').textContent=`✓ 接続OK / API ${r.version||''}`;}catch(e){$('settingMsg').textContent='△ 応答確認は不可。保存時は自動フォールバックします。';}});
  function configured(){return !!(localStorage.getItem(LS.url)&&localStorage.getItem(LS.key));}
  function loadSettingsForm(){$('gasUrl').value=localStorage.getItem(LS.url)||'';$('apiKey').value=localStorage.getItem(LS.key)||'';$('terminalName').value=localStorage.getItem(LS.terminal)||'';$('settingMsg').textContent='';}
  function saveSettingsForm(){localStorage.setItem(LS.url,$('gasUrl').value.trim());localStorage.setItem(LS.key,$('apiKey').value.trim());localStorage.setItem(LS.terminal,$('terminalName').value.trim());}
})();
