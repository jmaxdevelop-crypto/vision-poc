<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J-MAX Shipping</title>
<style>
:root{--navy:#143b5d;--blue:#1f5f99;--line:#d8e0e8;--bg:#f4f7fa;--ok:#0b6b3e;--warn:#9a5b00;--err:#a61b1b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1d2b36}
header{height:62px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 1px 4px #0002}header h1{font-size:20px;margin:0}header .ver{font-size:12px;opacity:.85}
.wrap{max-width:980px;margin:18px auto;padding:0 14px 30px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px #0000000a}.top{display:grid;grid-template-columns:1.5fr .5fr .5fr;gap:12px;padding:16px}.metric{border:1px solid var(--line);border-radius:10px;padding:13px;background:#fbfcfd}.metric b{display:block;color:#637180;font-size:12px;margin-bottom:5px}.shipment-id{font-size:26px;font-weight:900;color:var(--navy)}.num{font-size:26px;font-weight:900;text-align:right}
.scan-card{margin-top:14px;padding:16px}.scan-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.scan-head strong{font-size:16px}.status{margin-top:12px;min-height:74px;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;font-weight:850;padding:12px;background:#edf2f7;color:#5b6874;white-space:pre-wrap}.status.ok{background:#e7f7ef;color:var(--ok)}.status.duplicate,.status.warning{background:#fff3df;color:var(--warn)}.status.error{background:#fdecec;color:var(--err)}
.last{margin-top:12px;display:none;grid-template-columns:1fr 1.25fr .5fr;gap:10px}.last>div{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}.last b{display:block;font-size:11px;color:#617080;margin-bottom:4px}.last span{font-weight:850;overflow-wrap:anywhere}.actions{display:flex;gap:10px;margin-top:14px}.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer}.btn-primary{background:var(--blue);color:#fff;flex:1;font-size:18px}.btn-secondary{background:#e8eef4;color:#27445d}.btn:disabled{opacity:.45;cursor:not-allowed}
.list-card{margin-top:14px;overflow:hidden}.list-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.table-wrap{max-height:420px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid #edf1f4;text-align:left}th{position:sticky;top:0;background:#f8fafc;color:#52606d}.td-num{text-align:right;font-weight:800}.empty{padding:28px;text-align:center;color:#7b8793}.sync{font-size:12px;color:#697887}.sync.bad{color:var(--err);font-weight:700}.local{color:var(--blue);font-weight:800;white-space:nowrap}
dialog{border:0;border-radius:12px;padding:0;max-width:620px;width:calc(100% - 30px);box-shadow:0 18px 60px #0005}dialog::backdrop{background:#0006}.dlg{padding:18px}.dlg h2{margin:0 0 12px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;color:#566575;margin-bottom:5px}.field input{width:100%;padding:10px 11px;border:1px solid #b9c6d2;border-radius:8px;font:14px monospace}.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
details.diag{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}details.diag pre{white-space:pre-wrap;word-break:break-all;font-size:11px;background:#f7f9fb;padding:10px;border-radius:8px;max-height:180px;overflow:auto}.overlay{display:none;position:fixed;inset:0;background:#0d2740e8;z-index:30;align-items:center;justify-content:center}.overlay-box{background:white;border-radius:16px;padding:30px 36px;text-align:center;min-width:320px}.overlay-box .ov-id{font-size:32px;font-weight:900;color:var(--navy)}.overlay-box p{font-size:18px;margin:10px 0 0}
@media(max-width:760px){.top{grid-template-columns:1fr 1fr}.top .metric:first-child{grid-column:1/3}.last{grid-template-columns:1fr}.shipment-id{font-size:22px}th:nth-child(1),td:nth-child(1),th:nth-child(2),td:nth-child(2){display:none}}
</style>
</head>
<body>
<header><h1>J-MAX Shipping</h1><div><span class="ver">GitHub Pages v4.1 FastAck</span>　<button class="btn btn-secondary" style="padding:7px 10px" id="settingsBtn">設定</button></div></header>
<div class="wrap">
<section class="card top"><div class="metric"><b>現在の便</b><div id="shipmentId" class="shipment-id">最初のQRを読み取ってください</div></div><div class="metric"><b>読取件数</b><div id="count" class="num">0</div></div><div class="metric"><b>合計数量</b><div id="totalQty" class="num">0</div></div></section>
<section class="card scan-card"><div class="scan-head"><strong>QR / バーコード待機</strong><span id="syncText" class="sync">端末待機</span></div><div id="status" class="status">設定後、QRを読み取ってください</div><div id="last" class="last"><div><b>品番</b><span id="lastPart"></span></div><div><b>品名</b><span id="lastName"></span></div><div><b>数量</b><span id="lastQty"></span></div></div><div class="actions"><button id="completeBtn" class="btn btn-primary" disabled>積 載 完 了</button></div><details class="diag"><summary>診断情報</summary><pre id="diag">—</pre></details></section>
<section class="card list-card"><div class="list-head"><strong>現在便の積載リスト</strong><span id="pendingText" class="sync"></span></div><div class="table-wrap"><table><thead><tr><th>時刻</th><th>種別</th><th>品番</th><th>品名</th><th>数量</th><th>エフNo.</th><th>状態</th></tr></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty">まだ読み取りはありません</div></div></section>
</div>
<dialog id="settingsDialog"><div class="dlg"><h2>接続設定</h2><p style="font-size:13px;color:#566575">QR読取中はGoogle通信しません。積載完了時に1回だけ一括保存します。</p><div class="field"><label>GAS WebアプリURL（/exec）</label><input id="gasUrl" placeholder="https://script.google.com/macros/s/.../exec"></div><div class="field"><label>APIキー</label><input id="apiKey"></div><div class="field"><label>端末名（任意）</label><input id="terminalName" placeholder="例：出荷場PC1"></div><div id="settingMsg" style="font-size:13px"></div><div class="dlg-actions"><button class="btn btn-secondary" id="testBtn">接続テスト</button><button class="btn btn-primary" style="flex:none;font-size:14px" id="saveBtn">保存</button></div></div></dialog>
<div id="overlay" class="overlay"><div class="overlay-box"><div>✓ 積載登録 完了</div><div id="overlayId" class="ov-id"></div><p><span id="overlayCount"></span>件 / 合計 <span id="overlayQty"></span></p></div></div>
<script>
(()=>{
'use strict';
const APP_VERSION='4.1';
const LS={url:'jm_shipping_gas_url',key:'jm_shipping_api_key',terminal:'jm_shipping_terminal',client:'jm_shipping_client_id',queue:'jm_shipping_pending_queue'};
const $=id=>document.getElementById(id), dialog=$('settingsDialog'), statusEl=$('status');
const clientId=localStorage.getItem(LS.client)||(()=>{const v='c_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);localStorage.setItem(LS.client,v);return v;})();
let queue=safeArray(localStorage.getItem(LS.queue));
let activeSid=''; let completing=false; let scanSeq=0; let statusSerial=0;
let HID={buffer:'',firstAt:0,lastAt:0,maxGap:0,keyCount:0,separatorCount:0,timer:null,failTimer:null};
const seenRaw=new Set();

window.addEventListener('load',()=>{
 loadSettingsForm(); migrateOldLocalState(); pruneQueue(); chooseActiveSid(); rebuildSeen(); render();
 if(!configured()){dialog.showModal();setStatus('最初に接続設定をしてください','warning');}else setStatus('読み取り待機中','');
});

// Inspectと同じ document keydown のHIDバッファ方式。
// 違いは、途中のEnter/Tabでまだ伝票として成立していなければ区切りとして継続することだけ。
document.addEventListener('keydown',e=>{
 if(dialog.open||completing)return;
 if(e.ctrlKey||e.altKey||e.metaKey)return;
 const now=performance.now();
 if(e.key==='Escape'){resetHid();return;}
 if(e.key==='Enter'||e.key==='Tab'){
   e.preventDefault();e.stopPropagation();
   if(!HID.firstAt)HID.firstAt=now;
   const candidate=normalizeRaw(HID.buffer);
   const parsed=candidate?parseBarcode(candidate):null;
   if(parsed&&parsed.parseStatus==='OK'){commitHidScan(candidate,parsed,e.key);return;}
   HID.buffer+=' '; HID.separatorCount++; HID.lastAt=now; scheduleHidIdle(); return;
 }
 if(e.key.length!==1)return;
 if(HID.lastAt){const gap=now-HID.lastAt;if(gap>HID.maxGap)HID.maxGap=gap;}
 if(!HID.firstAt){HID.firstAt=now;setStatus('読み取り中…','');hideParsed();}
 HID.lastAt=now;HID.keyCount++;HID.buffer+=e.key;
 e.preventDefault();e.stopPropagation();scheduleHidIdle();
},true);

function scheduleHidIdle(){
 clearTimeout(HID.timer);clearTimeout(HID.failTimer);
 HID.timer=setTimeout(()=>{
   const raw=normalizeRaw(HID.buffer); if(!raw)return;
   const p=parseBarcode(raw);
   if(p.parseStatus==='OK')commitHidScan(raw,p,'idle250');
   else HID.failTimer=setTimeout(()=>failHid(raw),750);
 },250);
}
function failHid(raw){
 const dur=HID.firstAt?performance.now()-HID.firstAt:0;
 $('diag').textContent=`受信長: ${raw.length}\nキー数: ${HID.keyCount}\n区切り継続: ${HID.separatorCount}\n読取時間: ${Math.round(dur)} ms\n最大キー間隔: ${HID.maxGap.toFixed(1)} ms\n解析状態: 要確認\nRAW:\n${visibleRaw(raw)}`;
 setStatus(`⚠ 読み取り失敗（${raw.length}文字）\nもう一度QRを読み取ってください`,'error');beep(180,.18);setTimeout(()=>beep(180,.18),220);resetHid(false);
}
function commitHidScan(raw,parsed,reason){
 clearTimeout(HID.timer);clearTimeout(HID.failTimer);
 const dur=HID.firstAt?performance.now()-HID.firstAt:0;
 $('diag').textContent=`受信長: ${raw.length}\nキー数: ${HID.keyCount}\n区切り継続: ${HID.separatorCount}\n読取時間: ${Math.round(dur)} ms\n最大キー間隔: ${HID.maxGap.toFixed(1)} ms\n確定理由: ${reason}\n種別: ${parsed.type}\n解析状態: ${parsed.parseStatus}\nRAW:\n${visibleRaw(raw)}`;
 if(seenRaw.has(raw)){setStatus('⚠ すでに読み取り済みです。記録しません。','duplicate');beep(260,.15);resetHid(false);return;}
 if(!activeSid)activeSid=nextLocalSid();
 const eventId=clientId+'_'+Date.now().toString(36)+'_'+(++scanSeq);
 queue.push({raw,parsed,shipmentId:activeSid,eventId,createdAt:Date.now()});seenRaw.add(raw);saveQueue();render();showParsed(parsed);setTransientStatus(`✓ ${parsed.partNo}　読み取りOK`,'ok',650);beep(880,.06);resetHid(false);
}
function resetHid(clearStatus=true){clearTimeout(HID.timer);clearTimeout(HID.failTimer);HID={buffer:'',firstAt:0,lastAt:0,maxGap:0,keyCount:0,separatorCount:0,timer:null,failTimer:null};if(clearStatus)setStatus('読み取り待機中','');}

async function completeShipment(){
 if(completing)return;
 const items=currentItems();
 if(!activeSid||!items.length){setStatus('まだバーコードが読み取られていません。','warning');return;}
 if(!configured()){dialog.showModal();setStatus('接続設定を確認してください','warning');return;}
 completing=true;updateCompleteButton();setSync(false,'Google保存中…');setStatus(`積載 ${items.length}件をGoogleへ一括保存中…`,'');
 const commitId=ensureCommitId(activeSid);
 try{
   const r=await apiPost({action:'commit_shipment',key:getKey(),clientId,terminal:getTerminal(),shipmentId:activeSid,commitId,items:items.map(x=>({raw:x.raw,eventId:x.eventId,createdAt:x.createdAt}))});
   if(r.status!=='completed')throw new Error(r.message||'保存できませんでした');
   const s=r.completedShipment||{shipmentId:r.shipmentId||activeSid,count:items.length,totalQuantity:sumQty(items)};
   const doneSid=activeSid;
   queue=queue.filter(q=>String(q.shipmentId||'')!==doneSid);saveQueue();localStorage.removeItem('jm_shipping_local_state');clearCommitId(doneSid);seenRaw.clear();chooseActiveSid();rebuildSeen();render();
   setSync(true,'保存完了');setStatus(`✓ 積載完了　${s.shipmentId}`,'ok');$('overlayId').textContent=s.shipmentId;$('overlayCount').textContent=s.count;$('overlayQty').textContent=s.totalQuantity;$('overlay').style.display='flex';beep(1050,.08);setTimeout(()=>beep(1320,.1),110);
   setTimeout(()=>{$('overlay').style.display='none';setSync(true,'端末待機');setStatus(activeSid?'旧キャッシュ便を復元しました':'次の便：最初のQRを読み取ってください','');},1500);
 }catch(e){setSync(false,'保存失敗');setStatus(`⚠ Google保存できません\n${e.message||e}\n端末データは残っています。もう一度「積載完了」で再試行できます。`,'error');}
 finally{completing=false;updateCompleteButton();}
}
$('completeBtn').addEventListener('click',completeShipment);

async function apiPost(payload){
 const url=getUrl();const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),10000);
 try{
   const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),cache:'no-store',redirect:'follow',credentials:'omit',signal:ctl.signal});
   if(!res.ok)throw new Error('HTTP '+res.status);
   const text=await res.text();let data;try{data=JSON.parse(text)}catch(_){throw new Error('GAS応答がJSONではありません');}
   if(data.status==='error')throw new Error(data.message||'GASエラー');return data;
 }catch(e){
   // POSTの応答だけが遅延/欠落しても、commitIdでGoogle側の保存完了をGET確認する。
   if(payload&&payload.action==='commit_shipment'&&payload.commitId){
     const confirmed=await waitCommitConfirmation(payload.commitId,8,1200);
     if(confirmed)return confirmed;
   }
   if(e&&e.name==='AbortError')throw new Error('GAS応答タイムアウト（保存確認もできません）');
   throw e;
 }finally{clearTimeout(timer);}
}
async function waitCommitConfirmation(commitId,maxTries=8,intervalMs=1200){
 for(let i=0;i<maxTries;i++){
   if(i)await new Promise(r=>setTimeout(r,intervalMs));
   try{
     const q=new URLSearchParams({action:'commit_status',key:getKey(),clientId,commitId,_t:String(Date.now())});
     const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),4000);
     try{
       const res=await fetch(getUrl()+'?'+q.toString(),{cache:'no-store',redirect:'follow',credentials:'omit',signal:ctl.signal});
       if(!res.ok)continue;
       const text=await res.text();let data;try{data=JSON.parse(text)}catch(_){continue;}
       if(data&&data.status==='completed')return data;
     }finally{clearTimeout(timer);}
   }catch(_){ }
 }
 return null;
}
async function apiGet(action){
 const q=new URLSearchParams({action,key:getKey(),clientId,_t:String(Date.now())});
 const res=await fetch(getUrl()+'?'+q.toString(),{cache:'no-store',credentials:'omit'});const text=await res.text();let data;try{data=JSON.parse(text)}catch(_){throw new Error('GAS応答がJSONではありません');}if(data.status==='error')throw new Error(data.message||'GASエラー');return data;
}

function currentItems(){return queue.filter(q=>isValidItem(q)&&String(q.shipmentId||'')===String(activeSid||''));}
function isValidItem(q){if(!q||!q.raw)return false;const p=parseBarcode(normalizeRaw(q.raw));return p.parseStatus==='OK';}
function pruneQueue(){const out=[],seen=new Set();for(const q of queue){if(!isValidItem(q))continue;q.raw=normalizeRaw(q.raw);q.parsed=parseBarcode(q.raw);if(!q.shipmentId)q.shipmentId=activeSid||nextLocalSid();if(!q.eventId)q.eventId=clientId+'_legacy_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);const k=String(q.shipmentId)+'\u0001'+q.raw;if(seen.has(k))continue;seen.add(k);out.push(q);}queue=out;saveQueue();}
function migrateOldLocalState(){try{const old=JSON.parse(localStorage.getItem('jm_shipping_local_state')||'null');if(!old||!old.currentShipmentId||!Array.isArray(old.items))return;const keys=new Set(queue.map(q=>String(q.shipmentId||'')+'\u0001'+normalizeRaw(q.raw||'')));for(const it of old.items){const raw=normalizeRaw(it&&it.raw||'');if(!raw)continue;const p=parseBarcode(raw);if(p.parseStatus!=='OK')continue;const k=old.currentShipmentId+'\u0001'+raw;if(keys.has(k))continue;queue.push({raw,parsed:p,shipmentId:old.currentShipmentId,eventId:String(it.eventId||'')||clientId+'_recover_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7),createdAt:Date.now()});keys.add(k);}saveQueue();}catch(_){}}
function chooseActiveSid(){const valid=queue.filter(isValidItem);if(!valid.length){activeSid='';return;}const groups=new Map();for(const q of valid){const sid=String(q.shipmentId||'');const t=Number(q.createdAt)||0;if(!groups.has(sid)||groups.get(sid)<t)groups.set(sid,t);}activeSid=[...groups.entries()].sort((a,b)=>b[1]-a[1])[0][0];}
function rebuildSeen(){seenRaw.clear();for(const q of currentItems())seenRaw.add(normalizeRaw(q.raw));}
function nextLocalSid(){const d=new Date(),day=String(d.getFullYear())+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'),dk='jm_shipping_seq_date',nk='jm_shipping_seq_no';let n=localStorage.getItem(dk)===day?Number(localStorage.getItem(nk)||0):0;n++;localStorage.setItem(dk,day);localStorage.setItem(nk,String(n));return day+'-'+String(n).padStart(3,'0');}
function commitKey(sid){return 'jm_shipping_commit_'+sid;}function ensureCommitId(sid){let v=localStorage.getItem(commitKey(sid));if(!v){v=clientId+'_commit_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);localStorage.setItem(commitKey(sid),v);}return v;}function clearCommitId(sid){localStorage.removeItem(commitKey(sid));}
function saveQueue(){localStorage.setItem(LS.queue,JSON.stringify(queue));}
function sumQty(items){return items.reduce((a,x)=>a+(Number((x.parsed||parseBarcode(x.raw)).quantity)||0),0);}

function render(){const items=currentItems();$('shipmentId').textContent=activeSid||'最初のQRを読み取ってください';$('count').textContent=items.length;$('totalQty').textContent=sumQty(items);$('pendingText').textContent=items.length?`端末バッファ ${items.length}件` : '';const tb=$('tbody');tb.innerHTML='';$('empty').style.display=items.length?'none':'block';[...items].reverse().forEach(x=>{const p=x.parsed||parseBarcode(x.raw);const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(timeOnly(x.createdAt?new Date(x.createdAt).toLocaleString('ja-JP',{hour12:false}):''))}</td><td>${esc(p.type)}</td><td><b>${esc(p.partNo)}</b></td><td>${esc(p.partName)}</td><td class="td-num">${esc(p.quantity)}</td><td>${esc(p.fNo||'')}</td><td><span class="local">端末保持</span></td>`;tb.appendChild(tr);});updateCompleteButton();}
function updateCompleteButton(){$('completeBtn').disabled=completing||!activeSid||currentItems().length===0;}
function showParsed(p){$('last').style.display='grid';$('lastPart').textContent=p.partNo||'—';$('lastName').textContent=p.partName||'—';$('lastQty').textContent=p.quantity??'—';}function hideParsed(){$('last').style.display='none';}
function setStatus(t,c){statusSerial++;statusEl.textContent=t;statusEl.className='status'+(c?' '+c:'');return statusSerial;}function setTransientStatus(t,c,ms){const token=setStatus(t,c);setTimeout(()=>{if(token===statusSerial&&!completing)setStatus('読み取り待機中','');},ms||700);}function setSync(ok,t){$('syncText').textContent=t;$('syncText').className='sync'+(ok?'':' bad');}
function timeOnly(s){const m=String(s||'').match(/(\d{2}:\d{2}:\d{2})$/);return m?m[1]:s||'';}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function safeArray(s){try{const v=JSON.parse(s||'[]');return Array.isArray(v)?v:[]}catch{return[]}}function beep(freq,dur){try{const A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.05,c.currentTime);o.start();o.stop(c.currentTime+dur);o.onended=()=>c.close();}catch{}}

function configured(){return !!(getUrl()&&getKey());}function getUrl(){return (localStorage.getItem(LS.url)||'').trim();}function getKey(){return (localStorage.getItem(LS.key)||'').trim();}function getTerminal(){return (localStorage.getItem(LS.terminal)||'').trim();}
function loadSettingsForm(){$('gasUrl').value=getUrl();$('apiKey').value=getKey();$('terminalName').value=getTerminal();$('settingMsg').textContent='';}function saveSettingsForm(){localStorage.setItem(LS.url,$('gasUrl').value.trim());localStorage.setItem(LS.key,$('apiKey').value.trim());localStorage.setItem(LS.terminal,$('terminalName').value.trim());}
$('settingsBtn').onclick=()=>{loadSettingsForm();dialog.showModal();};$('saveBtn').onclick=()=>{saveSettingsForm();dialog.close();setStatus('読み取り待機中','');};$('testBtn').onclick=async()=>{saveSettingsForm();$('settingMsg').textContent='接続確認中…';try{const r=await apiGet('ping');$('settingMsg').textContent=`✓ 接続OK / API ${r.version||''}`;}catch(e){$('settingMsg').textContent='✕ '+(e.message||e);}};

function parseBarcode(raw){const fx=parseFixedFlexible(raw);if(fx)return fx;const lh=parseHondaLong(raw);if(lh)return lh;const h=parseHonda(raw);if(h)return h;return {type:'未判定',partNo:'',partName:'',quantity:null,orderNo:'',ticketDate:'',fNo:'',machineCode:'',nextProcess:'',tailCode:'',parseStatus:'要確認'};}
function parseFixedFlexible(raw){const text=String(raw||'').trim();if(isFixed141(text))return parseFixed141(text);const head=text.match(/^(\d{8})(20\d{6})\s*(\d{5}-[0-9A-Z]{3}-[0-9A-Z]{4,5}(?:-[0-9A-Z]{2,3})?)\s{2,}([\s\S]+)$/i);if(!head)return null;const orderRaw=head[1],dateRaw=head[2],partNo=head[3].toUpperCase(),rest=head[4];const body=rest.match(/^([A-Z0-9][A-Z0-9 ,./()\-]*?)\s{2,}(\d{1,5})([A-Z]\d{2})?([\s\S]*)$/i);if(!body)return null;const partName=body[1].trim(),quantity=Number(body[2]),nextProcess=(body[3]||'').toUpperCase(),tail=body[4]||'';if(!partName||!isFinite(quantity))return null;let type='固定長票',machineCode='',fNo='',tailCode='',m=tail.match(/(?:^|\s)(TR\d+)\s+([0-9A-Z]{8})([0-9A-Z]{8})\s*$/i);if(m){type='J-MAX 現品票(プレス品)';machineCode=m[1].toUpperCase();fNo=m[2];tailCode=m[3];}else{m=tail.match(/(?:^|\s)([A-Z]\d{2})\s+([0-9A-Z]{8})([0-9A-Z]{8})\s*$/i);if(m){machineCode=m[1].toUpperCase();fNo=m[2];tailCode=m[3];}else{m=tail.match(/([0-9A-Z]{8})([0-9A-Z]{8})\s*$/i);if(m){fNo=m[1];tailCode=m[2];}}if(nextProcess&&/^S\d{2}$/.test(nextProcess))type='J-MAX 現品票(溶接)';else if(/20\d{6}/.test(tail)&&!machineCode)type='外製搬入伝票(支払い用)';else if(machineCode)type='J-MAX 現品票(溶接)';}return {type,partNo,partName,quantity,orderNo:orderRaw.replace(/^0+/,''),ticketDate:ymd(dateRaw),fNo,machineCode,nextProcess,tailCode,parseStatus:'OK'};}
function isFixed141(raw){if(raw.length!==141)return false;const dateRaw=raw.slice(8,16),part=raw.slice(16,46).trim();return /^20\d{6}$/.test(dateRaw)&&/^[0-9A-Z-]{8,30}$/i.test(part)&&part.includes('-');}
function parseFixed141(raw){const orderRaw=raw.slice(0,8).trim(),dateRaw=raw.slice(8,16).trim(),partNo=raw.slice(16,46).trim(),partName=raw.slice(46,76).trim(),qtyZone=raw.slice(76,92),qtyMatch=qtyZone.match(/\d+/),nextMatch=qtyZone.match(/[A-Z]\d{2}/),machineCode=raw.slice(112,120).trim(),fNo=raw.slice(125,133).trim(),tailCode=raw.slice(133,141).trim();let type='固定長141票';if(nextMatch&&/^S\d{2}$/.test(nextMatch[0]))type='J-MAX 現品票(溶接)';else if(/^TR/i.test(machineCode))type='J-MAX 現品票(プレス品)';else if(!machineCode)type='外製搬入伝票(支払い用)';return {type,partNo,partName,quantity:qtyMatch?Number(qtyMatch[0]):null,orderNo:orderRaw.replace(/^0+/,''),ticketDate:ymd(dateRaw),fNo,machineCode,nextProcess:nextMatch?nextMatch[0]:'',tailCode,parseStatus:(partNo&&partName&&qtyMatch)?'OK':'要確認'};}
function parseHondaLong(raw){const text=String(raw),nameRe=/[A-Z][A-Z .\/-]{1,28},[A-Z][A-Z .\/,\-]{1,28}/g;let nm,partName='',nameStart=-1,nameEnd=-1;while((nm=nameRe.exec(text))){const c=nm[0].trim();if(!/J-MAX|CO\.?[, ]?LTD|CORPORATION/i.test(c)){partName=c;nameStart=nm.index;nameEnd=nm.index+nm[0].length;break;}}if(nameStart<0)return null;const cs=[],pr=/(\d{5})([0-9A-Z]{3})\s*([0-9A-Z]{4})\s*([0-9A-Z]{2})/g;let pm;while((pm=pr.exec(text))){if(pm.index<nameStart&&/[A-Z]/.test(pm[2])&&(nameStart-(pm.index+pm[0].length))<=80)cs.push(pm);}if(!cs.length)return null;const best=cs[cs.length-1],partNo=[best[1],best[2],best[3],best[4]].join('-').toUpperCase();let quantity=null;const after=text.slice(nameEnd,nameEnd+80),q=after.match(/^\D*(\d{8})/);if(q)quantity=Number(q[1]);return {type:'Honda 現品票（長尺）',partNo,partName,quantity,orderNo:'',ticketDate:'',fNo:'',machineCode:'',nextProcess:'',tailCode:'',parseStatus:(partNo&&partName&&quantity!==null)?'OK':'要確認'};}
function parseHonda(raw){const text=String(raw),pm=text.match(/(\d{5})\s*-\s*([0-9A-Z]{3})\s*-\s*([0-9A-Z]{4})\s*-\s*([0-9A-Z]{2})/i);if(!pm)return null;const partNo=[pm[1],pm[2],pm[3],pm[4]].join('-').toUpperCase();let partName='',nameEnd=-1;const re=/[A-Z][A-Z .\/-]{1,28},[A-Z][A-Z .\/,\-]{1,28}/g;let m;while((m=re.exec(text))){const c=m[0].trim();if(!/J-MAX|CO\.?[, ]?LTD/i.test(c)){partName=c;nameEnd=m.index+m[0].length;break;}}let quantity=null;if(nameEnd>=0){const after=text.slice(nameEnd,nameEnd+50),q=after.match(/^\D*(\d{8})/);if(q)quantity=Number(q[1]);}if(quantity===null){const q=text.match(/0{5,}(\d{1,3})/);if(q)quantity=Number(q[1]);}const eights=text.match(/\d{8}/g)||[];let fNo='';for(const x of eights){if(!/^0{4,}\d{1,4}$/.test(x)){fNo=x;break;}}return {type:'Honda 現品票',partNo,partName,quantity,orderNo:'',ticketDate:'',fNo,machineCode:'',nextProcess:'',tailCode:'',parseStatus:(partName&&quantity!==null)?'OK':'要確認'};}
function normalizeRaw(v){let s=String(v??'');s=s.replace(/[\x00-\x1F\x7F]+$/g,'');s=s.replace(/[\x00-\x1F\x7F]/g,' ');s=s.replace(/\u3000|\u00A0/g,' ');s=s.replace(/[！-～]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0));return s;}function ymd(s){return /^\d{8}$/.test(s)?`${s.slice(0,4)}/${s.slice(4,6)}/${s.slice(6,8)}`:s;}function visibleRaw(s){return s.replace(/ /g,'·');}
})();
